name: attendy-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    init: true
    environment:
      NODE_ENV: production
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to the public URL of your app}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your environment or .env file}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your environment or .env file}
    restart: unless-stopped
