services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    init: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_build:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      DATABASE_URL: postgres://attendy:attendy_dev_password@db:5432/attendy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendy
      POSTGRES_USER: attendy
      POSTGRES_PASSWORD: attendy_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendy -d attendy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  next_build:
  postgres_data:
